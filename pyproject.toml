[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-console-ryan-vo"
version = "1.0.0"
description = "Agent Substrate Console - Actor lifecycle and telemetry management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["agent-substrate", "actor", "telemetry", "ai", "ml", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.35",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.4.0",
    "python-multipart==0.0.9",
    "httpx==0.28.1",
    "prometheus-client==0.20.0",
    "structlog==25.1.0",
    "python-dotenv==1.0.1",
]
optional-dependencies = {dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.7",
    "pytest-cov==6.0.0",
    "httpx[test]==0.28.1",
    "faker==33.1.0",
    "ruff==0.5.0",
], postgres = ["asyncpg==0.29.0"]}

[project.urls]
Homepage = "https://github.com/A220man/orbit-console-ryan-vo"
Repository = "https://github.com/A220man/orbit-console-ryan-vo"
Issues = "https://github.com/A220man/orbit-console-ryan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PTH", "TRY", "SIM", "ARG", "PD", "PL", "RUF"]
ignore = ["S101", "S113", "T201"]
extend-select = ["TID"]
fixable = ["F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PTH", "TRY", "SIM", "ARG", "PD", "PL", "RUF"]
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"